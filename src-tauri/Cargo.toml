[package]
name = "veranda"
version = "0.1.0"
description = "A lightweight productivity app with timers, stopwatches, and todos"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "veranda"
path = "src/main.rs"
