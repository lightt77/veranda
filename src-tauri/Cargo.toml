[package]
name = "veranda"
version = "0.1.0"
description = "A lightweight productivity app with timers, stopwatches, and todos"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# SQLite
rusqlite = { version = "0.30", features = ["bundled", "chrono", "serde_json"] }

# HTTP client for downloading images
reqwest = { version = "0.11", features = ["blocking"] }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Notifications
mac-notification-sys = "0.6"

# Sound playback
rodio = "0.17"

# Async runtime
anyhow = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "sync", "time"] }

# Image hashing and random selection
sha2 = "0.10"
rand = "0.8"

[[bin]]
name = "veranda"
path = "src/main.rs"
